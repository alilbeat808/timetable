<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026학년도 2학기 부산동고등학교 학사일정 &amp; 시간표 시스템</title>
  
  <!-- Pretendard Korean Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Application CSS -->
  <link rel="stylesheet" href="app.css?v=8.7">
  <link rel="icon" type="image/png" href="logo.png?v=8.7">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section" onclick="switchTab('calendar')">
        <div class="brand-logo-container" title="부산동고등학교">
          <img src="logo.png?v=8.7" alt="부산동고등학교" class="brand-logo" id="brandSchoolLogo" onerror="this.style.display='none'; document.getElementById('brandLogoFallback').style.display='flex';">
          <div class="brand-logo-fallback" id="brandLogoFallback" style="display: none;">
            <span class="fallback-emblem">동고</span>
          </div>
        </div>
        <div class="brand-info">
          <h1>
            <span class="brand-title-full">
              <span class="brand-school-name">부산동고등학교</span>
              <span class="brand-title-divider">·</span>
              <span class="brand-system-name">학사일정 &amp; 시간표 시스템</span>
            </span>
            <span class="brand-title-short">학사일정 &amp; 시간표</span>
            <span class="brand-badge">2026학년도 2학기</span>
          </h1>
          <p class="brand-subtext">학사일정 캘린더 / 교사별 · 학반별 · 학생별 시간표 / 회의 시간 추천</p>
        </div>
      </div>

      <!-- Header Search & Tools (Clock Swapped to Left of Search) -->
      <div class="header-actions">
        <!-- Live Date & Clock Display -->
        <div class="header-live-clock" id="headerLiveClock" title="오늘 날짜 및 현재 시각">
          <span>📅</span>
          <span id="headerClockDateText">2026. 9. 4. (금)</span>
          <span id="headerClockTimeText">19:00:00</span>
        </div>

        <!-- Global Search Container -->
        <div class="search-container" id="globalSearchContainer">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearchInput" class="search-input" placeholder="교사, 학반, 학생, 학사일정 행사 검색..." autocomplete="off">
          <button type="button" id="globalSearchClearBtn" class="search-clear-btn" style="display: none;" title="검색어 지우기 / 전체 목록 복원">✕</button>
          <div id="globalSearchDropdown" class="search-dropdown" style="display: none;"></div>
        </div>

        <div class="header-tool-btns">
          <button class="icon-btn" id="printBtn" title="시간표 인쇄 / PDF 출력">
            🖨️
          </button>

          <button class="icon-btn" id="themeToggleBtn" title="다크 모드 / 라이트 모드 전환">
            🌙
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Desktop Navigation Tabs -->
  <div class="nav-tabs-wrapper">
    <nav class="nav-tabs">
      <button class="nav-tab-btn active" data-tab="calendar">
        <span>📅</span>
        <span>학사일정</span>
      </button>
      <button class="nav-tab-btn" data-tab="teacher">
        <span>👨‍🏫</span>
        <span>교사별 시간표</span>
      </button>
      <button class="nav-tab-btn" data-tab="class">
        <span>🏫</span>
        <span>학반별 시간표</span>
      </button>
      <button class="nav-tab-btn" data-tab="student">
        <span>🎓</span>
        <span>지금 우리 학생은</span>
      </button>
      <button class="nav-tab-btn" data-tab="meeting">
        <span>🤝</span>
        <span>공강 교집합 · 회의 추천</span>
      </button>
      <button class="nav-tab-btn" data-tab="free">
        <span>🔍</span>
        <span>공강 교사 검색 (보강)</span>
      </button>
      <button class="nav-tab-btn" data-tab="matrix">
        <span>📊</span>
        <span>전체 종합 현황판</span>
      </button>
      <button class="nav-tab-btn" data-tab="live">
        <span>⏰</span>
        <span>실시간 일과</span>
      </button>
      <button class="nav-tab-btn" data-tab="upload">
        <span>🔄</span>
        <span>파일 업로드</span>
      </button>
    </nav>
  </div>

  <!-- Main Content Viewport -->
  <main class="app-container" id="mainContentArea">
    <!-- Dynamic views rendered via app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-nav-bar">
    <button class="mobile-nav-item active" data-tab="calendar">
      <span>📅</span>
      <span>학사일정</span>
    </button>
    <button class="mobile-nav-item" data-tab="teacher">
      <span>👨‍🏫</span>
      <span>교사별</span>
    </button>
    <button class="mobile-nav-item" data-tab="class">
      <span>🏫</span>
      <span>학반별</span>
    </button>
    <button class="mobile-nav-item" data-tab="student">
      <span>🎓</span>
      <span>학생별</span>
    </button>
    <button class="mobile-nav-item" data-tab="meeting">
      <span>🤝</span>
      <span>회의추천</span>
    </button>
    <button class="mobile-nav-item" data-tab="live">
      <span>⏰</span>
      <span>실시간</span>
    </button>
    <button class="mobile-nav-item" data-tab="matrix">
      <span>📊</span>
      <span>종합</span>
    </button>
  </nav>

  <!-- Footer -->
  <footer class="app-footer">
    <p>2026학년도 2학기 부산동고등학교 학사일정 &amp; 시간표 시스템 &copy; 모바일 & 데스크톱 반응형 웹앱</p>
    <p style="font-size: 0.75rem; margin-top: 0.25rem;">교사 공강 교집합 분석 · HML 파서 내장 · 오프라인 단독 구동</p>
  </footer>

  <!-- Timetable Data Script (Rapid standalone load) -->
  <script src="timetable_data.js?v=8.7"></script>
  <!-- Application Core Script -->
  <script src="app.js?v=8.7"></script>
</body>
</html>
